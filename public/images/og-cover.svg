<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0c0a"/>
      <stop offset="100%" style="stop-color:#1a1612"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#c46b00;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Accent bar -->
  <rect x="80" y="260" width="6" height="100" rx="3" fill="#f6a400"/>

  <!-- Name -->
  <text x="110" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-2">Muhammad Mubashir</text>

  <!-- Title -->
  <text x="110" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="600" fill="#f6a400">MERN Stack Developer</text>

  <!-- Tags -->
  <text x="110" y="420" font-family="monospace" font-size="18" fill="#ffffff80">React · Node.js · MongoDB · Express · Tailwind CSS</text>

  <!-- Bottom strip -->
  <rect x="0" y="580" width="1200" height="50" fill="#f6a40018"/>
  <text x="80" y="612" font-family="monospace" font-size="16" fill="#f6a400">muhammadmubashir.tech</text>
  <text x="1120" y="612" font-family="monospace" font-size="16" fill="#ffffff50" text-anchor="end">IUB Alumni · Pakistan</text>

  <!-- Dot pattern decoration -->
  <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.5" fill="#f6a40020"/>
  </pattern>
  <rect x="800" y="0" width="400" height="300" fill="url(#dots)"/>
</svg>
