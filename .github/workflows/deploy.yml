name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build site
        shell: bash
        run: |
          if [[ -z "$VITE_EMAILJS_SERVICE_ID" || -z "$VITE_EMAILJS_TEMPLATE_ID" || -z "$VITE_EMAILJS_PUBLIC_KEY" ]]; then
            echo "::error::Missing required EmailJS repository secrets. Add SERVICE_ID, Message_Received_key, and Public_key in Settings > Secrets and variables > Actions."
            exit 1
          fi
          npm run build
        env:
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.Message_Received_key }}
          VITE_EMAILJS_AUTO_REPLY_TEMPLATE_ID: ${{ secrets.Auto_Reply_key }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.Public_key }}
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
